spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

spring.jackson:
  deserialization.fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

trecker:
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    token-url: https://accounts.spotify.com/api/token
    api-base: https://api.spotify.com/v1
  musicbrainz:
    api-base: https://musicbrainz.org/ws/2
    user-agent: Trecker/1.0 (trecker@example.com)
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    api-base: https://www.googleapis.com/youtube/v3
  tidal:
    client-id: ${TIDAL_CLIENT_ID:}
    client-secret: ${TIDAL_CLIENT_SECRET:}
    token-url: https://auth.tidal.com/v1/oauth2/token
    api-base: https://openapi.tidal.com/v2
    country-code: ${TIDAL_COUNTRY_CODE:US}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
    refresh-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
  cookie:
    secure: ${COOKIE_SECURE:false}
