spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/trecker_test"
    username: "test"
    password: "test"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

