# SonarQube Cloud analysis, run by .github/workflows/sonarqube.yml.
#
# The keys are the ones SonarQube Cloud assigns when it imports majlantalik/trecker. If the
# project page shows different ones, change them here.
sonar.organization=majlantalik
sonar.projectKey=majlantalik_trecker
sonar.projectName=Trecker

# The app: the Vue frontend and the Rust core. `backend/` is frozen (ADR 0006) and left out.
sonar.sources=frontend/src,src-tauri/src
sonar.exclusions=**/node_modules/**,frontend/dist/**,src-tauri/target/**,src-tauri/gen/**,\
  frontend/src/**/*.test.ts,frontend/src/test-setup.ts,src-tauri/src/repo/integration.rs

# Tests sit beside the code they test, so each test file is excluded from the sources above
# and included here; Sonar refuses to index one file as both. Rust tests are inline
# `mod tests` blocks and cannot be separated by file, apart from the repository integration
# tests.
sonar.tests=frontend/src,src-tauri/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/test-setup.ts,src-tauri/src/repo/integration.rs
sonar.coverage.exclusions=frontend/src/main.ts,frontend/src/**/*.d.ts

# Frontend coverage from `npm run test:coverage`. Vitest writes paths relative to frontend/,
# and the workflow rewrites them relative to this directory before the scan.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Rust coverage from cargo-llvm-cov, which writes absolute paths.
sonar.rust.lcov.reportPaths=src-tauri/lcov.info

# Sonar runs Clippy itself. It looks for Cargo.toml at the root by default, and it is not there.
sonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml

sonar.sourceEncoding=UTF-8
