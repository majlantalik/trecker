[package]
name = "trecker"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Local-first music listening tracker"
authors = ["mtulek"]

[lib]
name = "trecker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "sqlite",
    "migrate",
    "macros",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
